<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bagyt — персональный маршрут поступления</title>
<meta name="description" content="Сервис превращает профиль абитуриента Казахстана в маршрут: куда поступать, почему подходит и что делать следующим шагом.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bagyt — дизайн-система.
   Одна метафора: маршрут как линия со станциями. Она же — навигация,
   она же — план поступления. Всё остальное намеренно тихое.
   Единственное яркое место — сегментированная шкала соответствия,
   где ширина сегмента равна его весу в модели. */

:root {
  color-scheme: light only;

  --ink: #14202e;
  --ink-2: #47576b;
  --ink-3: #7d8b9c;
  --paper: #ffffff;
  --surface: #eef1f5;
  --surface-2: #f7f9fb;
  --line: #d6dde5;
  --line-soft: #e7ecf1;

  --route: #1b4fd8;
  --route-soft: #e8edfc;
  --grant: #a8680d;
  --grant-soft: #fdf2e0;
  --good: #0e7b5f;
  --good-soft: #e3f4ef;
  --risk: #b3341f;
  --risk-soft: #fdeceA;

  --r-sm: 6px;
  --r: 10px;
  --r-lg: 16px;

  --step: clamp(14px, 3.4vw, 16px);
  --gap: 14px;
  --pad: clamp(16px, 4.5vw, 24px);

  --shell: 560px;
  --font: 'Onest', ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--step);
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--route);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ——— каркас ——— */

.app {
  min-height: 100dvh;
  max-width: var(--shell);
  margin: 0 auto;
  background: var(--paper);
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid var(--line-soft);
  padding: 10px var(--pad) 0;
}

.topbar__row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 34px;
}

.brand {
  font-weight: 800;
  letter-spacing: -0.02em;
  font-size: 17px;
}
.brand span { color: var(--route); }

.topbar__stage {
  margin-left: auto;
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
}

.iconbtn {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: var(--r-sm);
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.iconbtn:hover { background: var(--surface-2); }

/* станции маршрута в шапке */
.stations {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 10px 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.stations::-webkit-scrollbar { display: none; }

.station {
  display: flex;
  align-items: center;
  gap: 0;
  flex: none;
}
.station__dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--paper);
  flex: none;
}
.station__rail {
  width: 18px;
  height: 2px;
  background: var(--line-soft);
}
.station__label {
  font-size: 11px;
  color: var(--ink-3);
  margin: 0 6px 0 5px;
  white-space: nowrap;
}
.station.is-done .station__dot { background: var(--route); border-color: var(--route); }
.station.is-done .station__label { color: var(--ink-2); }
.station.is-done + .station .station__rail { background: var(--route); }
.station.is-now .station__dot {
  border-color: var(--route);
  box-shadow: 0 0 0 4px var(--route-soft);
}
.station.is-now .station__label { color: var(--route); font-weight: 700; }

.main { flex: 1; padding: var(--pad) var(--pad) 40px; }
.main.has-dock { padding-bottom: 104px; }

/* ——— типографика ——— */

.h1 {
  font-size: clamp(25px, 6.6vw, 32px);
  line-height: 1.12;
  letter-spacing: -0.025em;
  font-weight: 800;
}
.h2 {
  font-size: 19px;
  line-height: 1.22;
  letter-spacing: -0.015em;
  font-weight: 700;
}
.h3 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.lead { color: var(--ink-2); line-height: 1.55; }
.small { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.tiny { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.stack > * + * { margin-top: var(--gap); }
.stack-lg > * + * { margin-top: 24px; }
.mt-s { margin-top: 8px; }

/* ——— кнопки ——— */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 18px;
  border-radius: var(--r);
  border: 1px solid transparent;
  background: var(--route);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  min-height: 46px;
}
.btn:hover { background: #1740b4; }
.btn:disabled { background: var(--line); color: var(--ink-3); cursor: not-allowed; }
.btn--ghost {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--line);
}
.btn--ghost:hover { background: var(--surface-2); }
.btn--slim { padding: 9px 14px; min-height: 38px; font-size: 13.5px; width: auto; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

.link {
  color: var(--route);
  text-decoration: underline;
  text-underline-offset: 2px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font-weight: 500;
}

/* ——— выбор ответов ——— */

.choices { display: grid; gap: 8px; }
.choices--2 { grid-template-columns: 1fr 1fr; }

.choice {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--paper);
  cursor: pointer;
  line-height: 1.3;
}
.choice:hover { border-color: var(--ink-3); }
.choice.is-on {
  border-color: var(--route);
  background: var(--route-soft);
  font-weight: 600;
}
.choice__mark {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  flex: none;
  display: grid;
  place-items: center;
  background: var(--paper);
}
.choice.is-on .choice__mark { border-color: var(--route); background: var(--route); }
.choice.is-on .choice__mark::after {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #fff;
}
.choice--box .choice__mark { border-radius: 4px; }
.choice__ico { color: var(--ink-3); width: 16px; text-align: center; flex: none; }
.choice.is-on .choice__ico { color: var(--route); }

.slider { width: 100%; accent-color: var(--route); }
.scorebox {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-weight: 800;
  font-size: 34px;
  letter-spacing: -0.03em;
}
.scorebox small { font-size: 14px; font-weight: 500; color: var(--ink-3); }

/* ——— карточки ——— */

.card {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--paper);
  padding: 16px;
}
.card--flat { background: var(--surface-2); border-color: var(--line-soft); }
.card--target { border-color: var(--route); border-width: 1.5px; }

.card__head { display: flex; align-items: flex-start; gap: 12px; }
.card__uni { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.card__name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
.card__score {
  margin-left: auto;
  text-align: right;
  flex: none;
}
.card__score b { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
.card__score span { display: block; font-size: 10.5px; color: var(--ink-3); }

.rank {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex: none;
}

/* сегментированная шкала: ширина = вес компонента в модели */
.segbar { display: flex; gap: 2px; height: 8px; margin: 12px 0 0; }
.segbar__seg {
  background: var(--surface);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.segbar__fill { position: absolute; inset: 0 auto 0 0; background: var(--route); }
.segbar__seg[data-weak='1'] .segbar__fill { background: var(--risk); }
.segbar__seg[data-mid='1'] .segbar__fill { background: var(--grant); }

.reasons { border-top: 1px solid var(--line-soft); margin-top: 14px; padding-top: 12px; }
.reason { display: flex; gap: 10px; align-items: flex-start; }
.reason + .reason { margin-top: 10px; }
.reason__key {
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 600;
  width: 92px;
  flex: none;
  padding-top: 1px;
  line-height: 1.3;
}
.reason__txt { font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.reason__txt b { color: var(--ink); font-weight: 600; }

/* ——— чипы и метки ——— */

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 100px;
  background: var(--surface);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip--good { background: var(--good-soft); color: var(--good); }
.chip--grant { background: var(--grant-soft); color: var(--grant); }
.chip--risk { background: var(--risk-soft); color: var(--risk); }
.chip--route { background: var(--route-soft); color: var(--route); }
.chip--demo {
  background: transparent;
  border: 1px dashed var(--line);
  color: var(--ink-3);
  font-weight: 500;
}

.note {
  font-size: 12px;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  padding: 10px 12px;
  line-height: 1.45;
}
.note--change {
  background: var(--route-soft);
  border-color: #c3d2f7;
  color: #143a9e;
}
.note--warn { background: var(--grant-soft); border-color: #eed6ae; color: #7a4c06; }
.note b { font-weight: 700; }

/* ——— диагностика ——— */

.facts { display: grid; gap: 1px; background: var(--line-soft); border-radius: var(--r); overflow: hidden; }
.fact { background: var(--paper); padding: 12px 14px; display: flex; gap: 12px; }
.fact__k { font-size: 12px; color: var(--ink-3); width: 96px; flex: none; }
.fact__v { font-size: 13.5px; font-weight: 600; }

.bullets .bullet { display: flex; gap: 9px; font-size: 13.5px; line-height: 1.45; }
.bullets .bullet + .bullet { margin-top: 8px; }
.bullet__m { flex: none; font-weight: 700; width: 14px; }
.bullet--plus .bullet__m { color: var(--good); }
.bullet--minus .bullet__m { color: var(--grant); }

/* ——— сравнение ——— */

.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
.cmp th, .cmp td {
  border-bottom: 1px solid var(--line-soft);
  padding: 10px 8px;
  text-align: left;
  vertical-align: top;
}
.cmp thead th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.cmp tbody th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; width: 88px; }
.cmp td { font-weight: 500; }
.cmp tr.is-priority td, .cmp tr.is-priority th { background: var(--route-soft); }
.cmp .win { color: var(--good); font-weight: 700; }
.scrollx { overflow-x: auto; margin: 0 calc(var(--pad) * -1); padding: 0 var(--pad); }

/* ——— маршрут ——— */

.route { position: relative; padding-left: 26px; }
.route::before {
  content: '';
  position: absolute;
  left: 4px; top: 6px; bottom: 6px;
  width: 2px;
  background: var(--line);
}
.step { position: relative; padding: 0 0 18px; }
.step::before {
  content: '';
  position: absolute;
  left: -26px; top: 4px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--paper);
  border: 2px solid var(--line);
}
.step.is-done::before { background: var(--route); border-color: var(--route); }
.step.is-next::before { border-color: var(--route); box-shadow: 0 0 0 4px var(--route-soft); }
.step__when { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.step__title { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; margin-top: 1px; }
.step.is-done .step__title { color: var(--ink-3); text-decoration: line-through; }
.step__detail { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-top: 5px; }
.step__meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.check {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 100px;
  padding: 5px 11px 5px 7px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.check__box {
  width: 15px; height: 15px;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-size: 10px;
  color: transparent;
}
.check.is-on { border-color: var(--route); color: var(--route); background: var(--route-soft); }
.check.is-on .check__box { background: var(--route); border-color: var(--route); color: #fff; }

.progress {
  height: 6px;
  background: var(--surface);
  border-radius: 100px;
  overflow: hidden;
}
.progress__fill { height: 100%; background: var(--route); border-radius: 100px; transition: width .25s ease; }

/* ——— док «следующий шаг» ——— */

.dock {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: var(--paper);
  border-top: 1px solid var(--line);
  padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  max-width: var(--shell);
  margin: 0 auto;
  box-shadow: 0 -8px 24px rgba(20, 32, 46, .07);
}
.dock__row { display: flex; align-items: center; gap: 12px; }
.dock__k { font-size: 10.5px; color: var(--route); font-weight: 700; letter-spacing: .04em; }
.dock__t { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
.dock__when { font-size: 11.5px; color: var(--ink-3); }

/* ——— лист с подробностями ——— */

.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(20, 32, 46, .42);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet__body {
  background: var(--paper);
  width: 100%;
  max-width: var(--shell);
  max-height: 92dvh;
  overflow-y: auto;
  border-radius: 18px 18px 0 0;
  padding: 18px var(--pad) calc(28px + env(safe-area-inset-bottom));
}
.sheet__grab { width: 40px; height: 4px; background: var(--line); border-radius: 100px; margin: 0 auto 14px; }

/* ——— пустые и предельные состояния ——— */

.empty {
  border: 1px dashed var(--line);
  border-radius: var(--r-lg);
  padding: 26px 18px;
  text-align: center;
  background: var(--surface-2);
}
.empty__t { font-weight: 700; }
.empty__d { font-size: 13px; color: var(--ink-2); margin-top: 6px; }

.rail { display: none; }

/* ——— рабочий стол: маршрут уходит в боковую колонку ——— */

@media (min-width: 900px) {
  :root { --shell: 1000px; }
  .rail { display: block; }
  body { padding: 28px 0; }
  .app {
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    min-height: auto;
  }
  .layout { display: grid; grid-template-columns: 236px 1fr; }
  .rail {
    border-right: 1px solid var(--line-soft);
    padding: var(--pad);
    background: var(--surface-2);
  }
  .rail .stations {
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding: 0;
    overflow: visible;
  }
  .rail .station { flex-direction: row; padding: 7px 0; }
  .rail .station__rail { display: none; }
  .rail .station__label { font-size: 12.5px; }
  .rail .station { position: relative; }
  .rail .station::before {
    content: '';
    position: absolute;
    left: 4px; top: 0; bottom: 0;
    width: 2px;
    background: var(--line-soft);
    z-index: -1;
  }
  .rail .station.is-done::before { background: var(--route); }
  .topbar .stations { display: none; }
  .main { padding: 26px 30px 40px; max-width: 660px; }
  .main.has-dock { padding-bottom: 26px; }
  .dock { position: static; max-width: none; box-shadow: none; border-top: 0; }
  .dock-wrap {
    margin: 0 30px 26px;
    border: 1.5px solid var(--route);
    border-radius: var(--r-lg);
    overflow: hidden;
    max-width: 600px;
  }
  .sheet { align-items: center; padding: 24px; }
  .sheet__body { border-radius: 18px; max-width: 620px; }
  .sheet__grab { display: none; }
}

</style>
</head>
<body>
<div class="app" id="app"></div>
<noscript>
  <div style="padding:24px;font-family:system-ui">
    <h1>Bagyt</h1>
    <p>Для работы сервиса нужен включённый JavaScript: весь подбор считается в браузере,
    без отправки ваших данных на сервер.</p>
  </div>
</noscript>
<script>
(function () {
'use strict';
/* ===== src/data/taxonomy.js ===== */
// Справочники предметной области: направления, профильные предметы ЕНТ,
// пороговые баллы, бюджетные уровни, города.
// Источники по пороговым баллам и формату ЕНТ указаны в SOURCES.

const ENT_MAX = 140;

const SOURCES = {
  entFormat: {
    label: 'НЦТ: формат и сроки ЕНТ-2026',
    url: 'https://testcenter.kz/',
  },
  thresholds: {
    label: 'Пороговые баллы ЕНТ-2026',
    url: 'https://www.nur.kz/society/2348017-porogovye-bally-i-granty-vypusknikam-kazahstana-raskryli-informaciyu-po-ent-2026/',
  },
  grantRules: {
    label: 'Правила конкурса на образовательный грант',
    url: 'https://egov.kz/',
  },
  cutoffs: {
    label: 'Проходные баллы на грант прошлых лет',
    url: 'https://univision.kz/grant/passing.html',
  },
};

// Направления. related — смежные направления для «частичного» совпадения.
const FIELDS = [
  { id: 'it', name: 'Программирование и IT', acc: 'программирование', icon: '⌘', related: ['data', 'eng'] },
  { id: 'data', name: 'Данные, AI и аналитика', acc: 'анализ данных', icon: '∿', related: ['it', 'econ'] },
  { id: 'eng', name: 'Инженерия и производство', acc: 'инженерию', icon: '⚙', related: ['energy', 'build', 'it'] },
  { id: 'energy', name: 'Энергетика и нефтегаз', acc: 'энергетику', icon: '△', related: ['eng', 'build'] },
  { id: 'econ', name: 'Экономика и финансы', acc: 'экономику и финансы', icon: '₸', related: ['biz', 'data'] },
  { id: 'biz', name: 'Бизнес и менеджмент', acc: 'менеджмент', icon: '◫', related: ['econ', 'law'] },
  { id: 'law', name: 'Право', acc: 'право', icon: '§', related: ['biz', 'soc'] },
  { id: 'soc', name: 'Общество, политика, медиа', acc: 'медиа и общественные науки', icon: '◍', related: ['law', 'lang', 'design'] },
  { id: 'med', name: 'Медицина и здоровье', acc: 'медицину', icon: '✚', related: ['bio'] },

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

const THRESHOLDS = {
  default: 50,
  national: 65,
  byField: {
    law: 75,
    edu: 75,
    med: 70,
    agro: 60,
  },
};

function thresholdFor(program) {
  const byField = program.fields
    .map((f) => THRESHOLDS.byField[f])
    .filter(Boolean);
  const base = program.national ? THRESHOLDS.national : THRESHOLDS.default;
  return Math.max(base, ...byField, 0);
}

/* ===== src/lib/scoring.js ===== */
// Движок подбора. Полностью детерминированный и объяснимый:
// каждый балл соответствия раскладывается на компоненты, и у каждого
// компонента есть текстовое объяснение с конкретными числами.
//
// Никакой генерации «на глаз»: одинаковый профиль всегда даёт одинаковый
// результат, а изменение любого ответа предсказуемо меняет итог.
//
// Отбор идёт в три слоя:
//   1. формальные требования — пара профильных предметов и пороговый балл;
//      не выполнены → программа вообще недоступна;
//   2. релевантность — направление и география; не совпали → вариант уходит
//      в «смежные», чтобы не вытеснять то, что человек действительно искал;
//   3. балл соответствия — взвешенная сумма шести компонентов.



const WEIGHTS = {
  interest: 28,
  chance: 26,
  budget: 20,
  city: 12,
  lang: 9,
  subjects: 5,
};

const COMPONENT_LABEL = {
  interest: 'Совпадение с интересами',
  chance: 'Шансы на поступление',
  budget: 'Бюджет',
  city: 'Город',
  lang: 'Язык обучения',
  subjects: 'Профильные предметы',
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const fmtMoney = (t) =>
  t === 0 ? 'стипендия' : `${(t / 1_000_000).toFixed(1).replace('.', ',')} млн ₸/год`;

// Ожидаемый балл корректируется на успеваемость, только если балл ещё не сдан.
function projectedScore(profile) {
  const raw = Number(profile.entScore) || 0;
  if (profile.entKnown === 'actual') return { score: raw, adjusted: 0 };
  const adj = gpaBonus(profile.gpa);
  return { score: clamp(raw + adj, 0, ENT_MAX), adjusted: adj };
}

// ——— Шансы на грант ———

const CHANCE_LEVELS = [
  { id: 'high', min: 10, label: 'Высокие шансы на грант', score: 100 },
  { id: 'good', min: 3, label: 'Хорошие шансы на грант', score: 85 },
  { id: 'border', min: -4, label: 'На границе проходного балла', score: 60 },
  { id: 'low', min: -14, label: 'Низкие шансы на грант', score: 30 },
  { id: 'unlikely', min: -999, label: 'Грант маловероятен', score: 10 },
];

const SEAT_ADJUST = { high: 4, mid: 0, low: -4 };

function grantChance(program, profile) {
  if (program.track === 'alt') {
    return {
      level: 'separate',
      label: 'Отдельный конкурс, не по ЕНТ',
      score: 55,
      gap: null,
      explain:
        `${program.short} отбирает не по баллу ЕНТ, а через свой конкурс и ` +
        'подготовительный год. Балл ЕНТ здесь ничего не решает.',
    };
  }
  const { score: proj } = projectedScore(profile);
  const seat = SEAT_ADJUST[program.grantSeats] ?? 0;
  const gap = proj + seat - program.cutoff;
  const level = CHANCE_LEVELS.find((l) => gap >= l.min);
  const diff = proj - program.cutoff;
  const direction =
    diff === 0
      ? 'это ровно на уровне вашего ориентира'
      : diff > 0
        ? `это на ${points(diff)} ниже вашего ориентира`
        : `это на ${points(Math.abs(diff))} выше вашего ориентира`;
  return {
    level: level.id,
    label: level.label,
    score: level.score,
    gap: diff,
    explain:
      `Ваш ориентир — ${proj} из ${ENT_MAX}. Грант здесь в прошлые годы ` +
      `закрывался на ${program.cutoff} баллах: ${direction}.`,
  };
}

// ——— Компоненты соответствия ———

function interestPart(program, profile) {
  const picked = profile.interests || [];
  const direct = program.fields.filter((f) => picked.includes(f));
  if (direct.length) {
    return {
      tier: 'direct',
      score: 100,
      explain: `Прямое попадание в ваш интерес «${fieldName(direct[0])}».`,
    };
  }
  const related = program.fields.find((f) => {
    const fd = fieldById(f);
    return fd && fd.related.some((r) => picked.includes(r));
  });
  if (related) {
    return {
      tier: 'related',
      score: 55,
      explain:
        `Смежное направление: «${fieldName(related)}» соседствует с тем, что вы выбрали, ` +
        'но это не то же самое.',
    };
  }
  return {
    tier: 'none',
    score: 0,
    explain: 'Направление не связано с тем, что вы выбрали.',
  };
}

function budgetPart(program, profile, chance) {
  const b = budgetById(profile.budget);
  if (program.tuition === 0) {
    return { score: 100, explain: 'Обучение покрывается стипендией вуза.' };
  }
  if (b.cap === 0) {
    const map = { high: 100, good: 85, border: 55, low: 25, unlikely: 8, separate: 70 };
    return {
      score: map[chance.level] ?? 30,
      explain:
        'Вы рассчитываете только на грант, поэтому всё зависит от шансов: ' +
        `${chance.label.toLowerCase()}. Платно здесь ${fmtMoney(program.tuition)}.`,
    };
  }
  const t = program.tuition;
  if (t <= b.cap * 0.6) {
    return { score: 100, explain: `${fmtMoney(t)} — заметно ниже вашего лимита.` };
  }
  if (t <= b.cap) {
    return { score: 85, explain: `${fmtMoney(t)} — укладывается в ваш бюджет.` };
  }
  if (t <= b.cap * 1.3) {
    return { score: 40, explain: `${fmtMoney(t)} — немного выше лимита, платно будет тяжело.` };
  }
  return {
    score: 10,
    explain: `${fmtMoney(t)} — сильно выше вашего лимита, реально только на грант.`,
  };
}

function langPart(program, profile) {
  const mine = profile.langs || [];
  const shared = program.langs.filter((l) => mine.includes(l));
  if (shared.length) {
    return {
      score: 100,
      explain: `Есть обучение на вашем языке: ${shared.map(langName).join(', ').toLowerCase()}.`,
    };
  }
  return {
    score: 25,
    explain:
      `Обучение только на ${program.langs.map(langName).join(' / ').toLowerCase()} — ` +
      'язык придётся подтянуть до начала учёбы.',
  };
}

function cityPart(program, profile) {
  const same = program.city === profile.city;
  const major = program.city === 'almaty' || program.city === 'astana';
  if (same) {
    return { fits: true, score: 100, explain: `Вуз в вашем городе — ${cityName(program.city)}.` };
  }
  if (profile.mobility === 'home') {
    return {
      fits: false,
      score: 0,
      explain:
        `Вуз в ${cityName(program.city)}, а вы не планируете переезд — ` +
        'придётся менять либо город, либо вариант.',
    };
  }
  if (profile.mobility === 'majors') {
    return major
      ? { fits: true, score: 90, explain: `${cityName(program.city)} — город, в который вы готовы переехать.` }
      : {
          fits: false,
          score: 20,
          explain: `${cityName(program.city)} не входит в города, куда вы готовы переехать.`,
        };
  }
  return { fits: true, score: 85, explain: `${cityName(program.city)} — вы открыты к переезду.` };
}

function subjectsPart(program, profile) {
  if (program.track === 'alt') {
    return { score: 70, explain: 'Пара профильных предметов ЕНТ здесь не требуется.' };
  }
  if (program.pairs.includes(profile.pair)) {
    return { score: 100, explain: `Ваша пара «${pairName(profile.pair)}» подходит.` };
  }
  return {
    score: 0,
    explain: `Нужна другая пара: ${program.pairs.map(pairName).join(' или ')}.`,
  };
}

// ——— Формальные блокировки ———

function blockers(program, profile, parts) {
  const out = [];
  if (program.track !== 'alt' && parts.subjects.score === 0) {
    out.push({
      type: 'subjects',
      title: 'Не та пара профильных предметов',
      detail:
        `Вы выбрали «${pairName(profile.pair)}», а здесь принимают с ` +
        `${program.pairs.map(pairName).join(' или ')}. Без нужной пары заявление не примут.`,
      fix: 'Сменить пару профильных предметов в профиле или выбрать другую программу.',
    });
  }
  const need = thresholdFor(program);
  const { score: proj } = projectedScore(profile);
  if (program.track !== 'alt' && proj < need) {
    out.push({
      type: 'threshold',
      title: `Ниже порогового балла (${need})`,
      detail:
        `Государство установило порог ${need} баллов для этого направления, ` +
        `а ваш ориентир — ${proj}. Нужно добрать минимум ${points(need - proj)}.`,
      fix: `Поднять балл до ${need} или выше.`,
    });
  }
  return out;
}

// ——— Итоговая оценка одной программы ———

function scoreProgram(program, profile) {
  const chance = grantChance(program, profile);
  const interest = interestPart(program, profile);
  const city = cityPart(program, profile);
  const parts = {
    interest,
    chance: { score: chance.score, explain: chance.explain },
    budget: budgetPart(program, profile, chance),
    city,
    lang: langPart(program, profile),
    subjects: subjectsPart(program, profile),
  };

  const total = Math.round(
    Object.keys(WEIGHTS).reduce((acc, k) => acc + (parts[k].score * WEIGHTS[k]) / 100, 0),
  );

  const blocks = blockers(program, profile, parts);
  const ordered = Object.keys(WEIGHTS)
    .map((k) => ({ key: k, label: COMPONENT_LABEL[k], weight: WEIGHTS[k], ...parts[k] }))
    .sort((a, b) => b.score * b.weight - a.score * a.weight);

  return {
    program,
    total,
    chance,
    parts: ordered,
    blockers: blocks,
    eligible: blocks.length === 0,
    interestTier: interest.tier,
    cityFits: city.fits,
    strengths: ordered.filter((p) => p.score >= 85).slice(0, 3),
    caution: ordered.filter((p) => p.score < 60).slice(-1)[0] || null,
    threshold: thresholdFor(program),
  };
}

// ——— Ранжирование каталога ———
//
// Кейс требует минимум три рекомендации, но бывает честный конфликт: человек
// хочет медицину, а выбрал пару «Математика — Физика», с которой на медицину
// не принимают вообще. Выдумывать три варианта в такой ситуации нельзя.
// Поэтому список собирается по лестнице, и каждый вариант ниже первой ступени
// несёт честную пометку, почему он здесь.

const LADDER = [
  { id: 'a', reason: null,
    test: (s) => s.eligible && s.interestTier === 'direct' && s.cityFits },
  { id: 'b', reason: 'Другой город — в вашей географии прямых вариантов мало',
    test: (s) => s.eligible && s.interestTier === 'direct' },
  { id: 'c', reason: 'Смежное направление — прямых совпадений мало',
    test: (s) => s.eligible && s.interestTier === 'related' },
  { id: 'd', reason: 'Доступно по вашей паре профильных предметов, но направление другое',
    test: (s) => s.eligible },
  { id: 'e', reason: 'Совпадает с интересом, но нужна другая пара профильных предметов',
    test: (s) => !s.eligible && s.interestTier === 'direct'
      && s.blockers.every((b) => b.type === 'subjects') },
];

function rankPrograms(profile, { limit = 6 } = {}) {
  const scored = PROGRAMS.map((p) => scoreProgram(p, profile));
  const byTotal = (a, b) => b.total - a.total;
  const used = new Set();

  const rungs = LADDER.map((rung) => {
    const items = scored
      .filter((s) => !used.has(s.program.id) && rung.test(s))
      .sort(byTotal);
    items.forEach((s) => {
      used.add(s.program.id);
      s.rung = rung.id;
      if (rung.reason) s.tierReason = rung.reason;
    });
    return items;
  });

  const [a, b, c, d, e] = rungs;
  let matches = a.slice(0, limit);
  const queue = [...b, ...c, ...d, ...e];
  while (matches.length < 3 && queue.length) matches.push(queue.shift());
  if (matches.length > 3) matches = matches.slice(0, Math.max(3, limit));

  const shown = new Set(matches.map((m) => m.program.id));
  const adjacent = [...b, ...c]
    .filter((s) => !shown.has(s.program.id))
    .slice(0, 4);
  const blocked = scored
    .filter((s) => !s.eligible && !shown.has(s.program.id)
      && (s.interestTier === 'direct' || s.interestTier === 'related'))
    .sort(byTotal)
    .slice(0, 4);

  return {
    matches,
    adjacent,
    blocked,
    counted: scored.length,
    directFits: a.length,
    conflict: conflictCheck(profile),
  };
}

// Какие пары профильных предметов открывают интересы пользователя.
function pairsUnlocking(interests = []) {
  const counts = {};
  PROGRAMS
    .filter((p) => p.pairs.length && p.fields.some((f) => interests.includes(f)))
    .forEach((p) => p.pairs.forEach((pair) => { counts[pair] = (counts[pair] || 0) + 1; }));
  return Object.entries(counts)
    .sort((x, y) => y[1] - x[1])
    .map(([id, n]) => ({ id, name: pairName(id), count: n }));
}

// Конфликт «интерес против пары предметов»: самая полезная вещь, которую
// сервис может сказать одиннадцатикласснику до регистрации на ЕНТ.
function conflictCheck(profile) {
  const interests = profile.interests || [];
  if (!interests.length) return null;
  const direct = PROGRAMS.filter((p) => p.fields.some((f) => interests.includes(f)));
  const open = direct.filter(
    (p) => p.track === 'alt' || p.pairs.includes(profile.pair),
  );
  if (open.length >= 3) return null;
  const options = pairsUnlocking(interests).filter((o) => o.id !== profile.pair);
  if (!options.length) return null;
  return {
    kind: 'pair',
    have: pairName(profile.pair),
    openNow: open.length,
    options: options.slice(0, 2),
    fields: interests.map(fieldName),
  };
}

// ——— Диагностика профиля ———

function diagnose(profile) {
  const { score: proj, adjusted } = projectedScore(profile);
  const strengths = [];
  const limits = [];

  if (proj >= 115) strengths.push('Балл в зоне самых конкурентных грантов');
  else if (proj >= 95) strengths.push('Балл позволяет бороться за гранты в сильных вузах');
  else if (proj >= 75) strengths.push('Балл открывает гранты в региональных и профильных вузах');
  else limits.push('Балла пока не хватает для большинства грантов — это приоритет номер один');

  if ((profile.langs || []).includes('en')) {
    strengths.push('Английский открывает программы на английском языке');
  } else {
    limits.push('Без английского закрыты КБТУ, КИМЭП, SDU и часть программ AITU');
  }
  if (profile.gpa === 'top' || profile.gpa === 'good') {
    strengths.push('Хорошая успеваемость — плюс при равных баллах и для «Алтын белгі»');
  }
  if (adjusted !== 0) {
    strengths.push(
      `Ориентир скорректирован на ${adjusted > 0 ? '+' : ''}${adjusted} с учётом успеваемости`,
    );
  }

  if (profile.mobility === 'home') {
    limits.push(`Только ${cityName(profile.city)} — это отсекает большую часть каталога`);
  }
  if (profile.budget === 'grant') {
    limits.push('Расчёт только на грант — платные варианты не подстрахуют');
  }
  if ((profile.interests || []).length > 3) {
    limits.push('Выбрано много направлений сразу — стоит сузить до двух');
  }
  if (!limits.length) {
    limits.push(
      'Проходные баллы меняются каждый год, поэтому запас в 5–7 баллов обязателен',
    );
  }

  return {
    projected: proj,
    adjusted,
    strengths: strengths.slice(0, 4),
    limits: limits.slice(0, 3),
    goal: buildGoal(profile, proj),
  };
}

function buildGoal(profile, proj) {
  const acc = (profile.interests || []).map(fieldAcc);
  const subject = acc.length ? acc.slice(0, 2).join(' и ') : 'выбранное направление';
  const where =
    profile.mobility === 'home'
      ? `в ${cityName(profile.city)}`
      : profile.mobility === 'majors'
        ? 'в Алматы или Астане'
        : 'в любом городе Казахстана';
  const money =
    profile.budget === 'grant' ? 'на гранте' : 'на гранте или платно в рамках бюджета';
  return `Поступить на ${subject} ${where} ${money}. Ориентир по ЕНТ — ${points(proj)}.`;
}

        'Условия уточните у классного руководителя — они зависят от всех лет обучения.',
    }));
  }

  steps.push(T({
    id: 'visit',
    when: 'Февраль — апрель 2027',
    cat: 'activity',
    title: 'Съездить на день открытых дверей',
    detail:
      program
        ? `Посмотрите ${program.short} в ${cityName(program.city)} живьём и задайте приёмной ` +
          'комиссии два вопроса: сколько грантов было в прошлом году и какой был проходной балл.'
        : 'Дни открытых дверей — самый быстрый способ получить настоящие цифры по грантам.',
    source: program ? { label: program.site.replace('https://', ''), url: program.site } : null,
  }));

  return steps;
}

// Ближайший невыполненный шаг — то, что показывается как «следующее действие».
function nextStep(steps, done) {
  return steps.find((s) => !done[s.id]) || null;
}

function planProgress(steps, done) {
  const total = steps.length;
  const complete = steps.filter((s) => done[s.id]).length;
  return { total, complete, pct: total ? Math.round((complete / total) * 100) : 0 };
}

function thresholdLabel(program) {
  return `Пороговый балл направления: ${thresholdFor(program)}`;
}

/* ===== src/lib/store.js ===== */
// Состояние приложения. Хранится в localStorage, поэтому маршрут не теряется
// при перезагрузке. Бэкенда нет: это осознанный выбор для демонстрации —
// весь полный путь работает локально и не зависит от внешних сервисов.

const KEY = 'bagyt.v1';

const EMPTY_PROFILE = {
  grade: '11',
  interests: [],
  gpa: 'good',
  entScore: 95,
  entKnown: 'expected',
  pair: 'math_phys',
  langs: ['ru'],
  city: 'almaty',
  mobility: 'majors',
  budget: 'to2',
  priorities: ['grant'],
};

const EMPTY_STATE = {
  screen: 'intro',
  profileStep: 0,
  profile: { ...EMPTY_PROFILE },
  completed: false,
  targetId: null,
  compareIds: [],
  saved: [],
  done: {},
  snapshot: null, // предыдущий результат подбора — для показа изменений
  changes: null,
};

function read() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return { ...EMPTY_STATE, ...parsed, profile: { ...EMPTY_PROFILE, ...parsed.profile } };
  } catch {
    return null;
  }
}

function write(state) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    return true;
  } catch {
    // Приватный режим браузера или заполненное хранилище — приложение
    // продолжает работать в памяти, просто без сохранения между сессиями.
    return false;
  }
}

function createStore() {
  let state = read() || { ...EMPTY_STATE };
  let persisted = true;
  const listeners = new Set();

  const notify = () => listeners.forEach((fn) => fn(state));

  return {
    get state() {
      return state;
    },
    get persisted() {
      return persisted;
    },
    subscribe(fn) {
      listeners.add(fn);
      return () => listeners.delete(fn);
    },
    set(patch) {
      state = { ...state, ...patch };
      persisted = write(state);
      notify();
    },
    setProfile(patch) {
      state = { ...state, profile: { ...state.profile, ...patch } };
      persisted = write(state);
      notify();
    },
    toggleIn(key, value, max = Infinity) {
      const list = state[key] || [];
      const next = list.includes(value)
        ? list.filter((v) => v !== value)
        : [...list, value].slice(-max);
      this.set({ [key]: next });
    },
    toggleProfileList(key, value, max = Infinity) {
      const list = state.profile[key] || [];
      const next = list.includes(value)
        ? list.filter((v) => v !== value)
        : [...list, value].slice(-max);
      this.setProfile({ [key]: next });
    },
    toggleDone(id) {
      const done = { ...state.done };
      if (done[id]) delete done[id];
      else done[id] = true;
      this.set({ done });
    },
    reset() {
      state = { ...EMPTY_STATE, profile: { ...EMPTY_PROFILE } };
      try {
        localStorage.removeItem(KEY);
      } catch { /* ignore */ }
      notify();
    },
  };
}

// ——— Что изменилось после правки профиля ———
// Жюри по сценарию проверки меняет бюджет, интерес, страну или экзамен.
// Сервис обязан не просто пересчитать, а показать, что именно сдвинулось.

function snapshotOf(result) {
  return {
    ids: result.matches.map((m) => m.program.id),
    top: result.matches[0]
      ? { id: result.matches[0].program.id, total: result.matches[0].total }
      : null,
    chances: Object.fromEntries(
      result.matches.map((m) => [m.program.id, m.chance.level]),
    ),
  };
}

const CHANCE_RANK = { unlikely: 0, low: 1, border: 2, good: 3, high: 4, separate: 2 };

function diffResult(prev, result) {
  if (!prev) return null;
  const snap = snapshotOf(result);
  const added = result.matches.filter((m) => !prev.ids.includes(m.program.id));
  const removed = prev.ids.filter((id) => !snap.ids.includes(id));
  const lines = [];

  if (added.length) {
    lines.push(
      `Появилось в списке: ${added.map((m) => `${m.program.short} — ${m.program.name}`).join('; ')}`,
    );
  }
  if (removed.length) {
    lines.push(`Ушло из списка: ${removed.length} вариант(а)`);
  }
  if (snap.top && prev.top && snap.top.id !== prev.top.id) {
    const nowTop = result.matches[0];
    lines.push(`Новый лучший вариант: ${nowTop.program.short}, соответствие ${nowTop.total}%`);
  } else if (snap.top && prev.top && snap.top.total !== prev.top.total) {
    const d = snap.top.total - prev.top.total;
    lines.push(`Соответствие лучшего варианта ${d > 0 ? 'выросло' : 'упало'} на ${Math.abs(d)}%`);
  }

  const shifted = Object.keys(snap.chances).filter(
    (id) => prev.chances[id] && prev.chances[id] !== snap.chances[id],
  );
  if (shifted.length) {
    const up = shifted.filter(
      (id) => CHANCE_RANK[snap.chances[id]] > CHANCE_RANK[prev.chances[id]],
    ).length;
    const down = shifted.length - up;
    const parts = [];
    if (up) parts.push(`выросли у ${up}`);
    if (down) parts.push(`упали у ${down}`);
    lines.push(`Шансы на грант ${parts.join(', ')} программ`);
  }

  if (!lines.length) return null;
  return { lines, snapshot: snap };
}

    return `<div class="segbar__seg" style="flex:${p.weight / totalW}" data-weak="${weak}" data-mid="${mid}"

      <div class="segbar__fill" style="width:${p.score}%"></div></div>`;
  }).join('')}</div>`;
}

function matchCard(m, idx, state) {
  const pr = m.program;
  const isTarget = state.targetId === pr.id;
  const inCompare = state.compareIds.includes(pr.id);
  const top2 = m.strengths.slice(0, 2);
  return `<article class="card ${isTarget ? 'card--target' : ''} stack">
    <div class="card__head">
      <span class="rank">${idx + 1}</span>
      <div>
        <div class="card__uni">${esc(pr.short)} · ${cityName(pr.city)}${pr.gop ? ` · ${pr.gop}` : ''}</div>
        <div class="card__name">${esc(pr.name)}</div>
      </div>
      <div class="card__score"><b>${m.total}%</b><span>соответствие</span></div>
    </div>

    ${segbar(m.parts)}

    <div class="chips" style="margin-top:12px">
      <span class="chip ${CHANCE_CHIP[m.chance.level]}">${m.chance.label}</span>
      <span class="chip chip--grant">${GRANT_SEATS_LABEL[pr.grantSeats]}</span>
      <span class="chip">${fmtMoney(pr.tuition)}</span>
      ${demoChip('Проходной балл и стоимость — демонстрационные данные')}
      ${isTarget ? '<span class="chip chip--route">Целевая программа</span>' : ''}
      ${m.tierReason ? `<span class="chip chip--grant">${esc(m.tierReason)}</span>` : ''}
    </div>

    <div class="reasons">
      ${top2.map((s) => `<div class="reason">
        <span class="reason__key">${esc(s.label)}</span>
        <span class="reason__txt">${esc(s.explain)}</span></div>`).join('')}
      ${m.caution ? `<div class="reason">
        <span class="reason__key" style="color:var(--grant)">Учтите</span>
        <span class="reason__txt">${esc(m.caution.explain)}</span></div>` : ''}
    </div>

    <div class="btn-row" style="margin-top:4px">
      <button class="btn btn--ghost btn--slim" data-act="open" data-v="${pr.id}">Почему подходит</button>
      <button class="btn btn--ghost btn--slim" data-act="compare" data-v="${pr.id}">
        ${inCompare ? 'В сравнении ✓' : 'Сравнить'}</button>
      <button class="btn btn--slim" data-act="target" data-v="${pr.id}">
        ${isTarget ? 'Выбрано' : 'Выбрать'}</button>
    </div>
  </article>`;
}

const QUICK_EDITS = [
  { step: 2, label: 'Балл ЕНТ', get: (p) => String(projectedScore(p).score) },
  { step: 6, label: 'Бюджет', get: (p) => budgetById(p.budget).name },
  { step: 1, label: 'Интересы', get: (p) => p.interests.map(fieldName).join(', ') || '—' },
  { step: 3, label: 'Профильные', get: (p) => pairName(p.pair) },
  { step: 5, label: 'География', get: (p) => cityName(p.city) },
];

function matchesScreen(state, result) {
  const p = state.profile;
  const quick = QUICK_EDITS.map((q) =>
    `<button class="check" data-act="edit" data-v="${q.step}">
      <span style="color:var(--ink-3);font-weight:500">${q.label}:</span> ${esc(q.get(p))} ✎
    </button>`).join('');

  const changes = state.changes
    ? `<div class="note note--change"><b>Ответ изменён — вот что стало другим:</b><br>
        ${state.changes.lines.map(esc).join('<br>')}</div>`
    : '';

  const c = result.conflict;
  const conflict = c
    ? `<div class="note note--warn">
        <b>Ваша пара предметов не сочетается с выбранным направлением.</b><br>
        С парой «${esc(c.have)}» вам открыто ${c.openNow === 0 ? 'ни одной программы' : `всего ${c.openNow}`}
        по направлению ${esc(c.fields.join(', ').toLowerCase())}. Это решается только до регистрации
        на ЕНТ — потом пара уже зафиксирована.
        <div class="chips" style="margin-top:10px">
          ${c.options.map((o) => `<button class="check" data-act="fixPair" data-v="${o.id}">
            Взять «${esc(o.name)}» — откроет ${o.count} программ</button>`).join('')}
        </div>
        <div class="tiny" style="margin-top:8px">Или оставьте пару как есть — ниже собраны

    : '';

  const empty = !result.matches.length
    ? `<div class="empty">
        <div class="empty__t">Под эти условия ничего не подошло</div>
        <div class="empty__d">Чаще всего мешает пара профильных предметов или запрет на переезд.
        Измените один ответ выше — список пересчитается сразу.</div>

  return `<div class="stack-lg">

      <p class="small">Проценты — это балл соответствия по шести критериям. Полоска под названием
      показывает вклад каждого: длина сегмента равна его весу в модели, заливка — насколько

    <div>

// ——— 5. Сравнение ———

const bestOf = (vals, dir) => {
  const nums = vals.filter((v) => typeof v === 'number');
  if (!nums.length) return null;
  return dir === 'max' ? Math.max(...nums) : Math.min(...nums);
};

function compareScreen(state, items) {
  if (items.length < 2) {
    return `<div class="stack-lg">
      <div class="stack">
        <div class="tiny">Этап 4 — сравнение</div>
        <h2 class="h1" style="font-size:clamp(22px,5.4vw,28px)">Сравнение вариантов</h2>
      </div>
      <div class="empty">
        <div class="empty__t">Нужно минимум два варианта</div>
        <div class="empty__d">Отметьте «Сравнить» на карточках рекомендаций — можно выбрать до трёх.</div>
        <div style="margin-top:14px"><button class="btn btn--slim" data-act="goto" data-v="matches">К рекомендациям</button></div>
      </div>
    </div>`;
  }

  const prio = state.profile.priorities || [];
  const rows = [
    { k: 'Соответствие', p: null, dir: 'max', v: (m) => m.total, f: (m) => `${m.total}%` },
    { k: 'Шансы на грант', p: 'grant', dir: null, f: (m) => `${m.chance.label}${m.chance.gap !== null ? `<br><span class="tiny">разрыв ${m.chance.gap > 0 ? '+' : ''}${m.chance.gap}</span>` : ''}` },
    { k: 'Проходной балл', p: 'grant', dir: 'min', v: (m) => m.program.cutoff, f: (m) => m.program.cutoff ? `${m.program.cutoff} ${demoChip()}` : 'свой конкурс' },
    { k: 'Пороговый балл', p: null, f: (m) => String(m.threshold) },
    { k: 'Стоимость', p: 'cost', dir: 'min', v: (m) => m.program.tuition, f: (m) => `${fmtMoney(m.program.tuition)} ${demoChip()}` },
    { k: 'Грантов', p: 'grant', f: (m) => GRANT_SEATS_LABEL[m.program.grantSeats] },
    { k: 'Город', p: 'city', f: (m) => cityName(m.program.city) },
    { k: 'Языки', p: 'lang', f: (m) => m.program.langs.map(langName).join(', ') },
    { k: 'Репутация', p: 'quality', dir: 'max', v: (m) => m.program.rep, f: (m) => `${'●'.repeat(m.program.rep)}${'○'.repeat(5 - m.program.rep)} ${demoChip()}` },
    { k: 'Трудоустройство', p: 'career', dir: 'max', v: (m) => m.program.career, f: (m) => `${'●'.repeat(m.program.career)}${'○'.repeat(5 - m.program.career)} ${demoChip()}` },
    { k: 'Профильные', p: null, f: (m) => m.program.pairs.length ? m.program.pairs.map(pairName).join('<br>') : 'не требуются' },
  ];

  const head = items.map((m) =>
    `<th><div class="card__uni">${esc(m.program.short)}</div>
     <div style="font-weight:700;font-size:12.5px;line-height:1.2">${esc(m.program.name)}</div>
     <button class="link tiny" data-act="compare" data-v="${m.program.id}" style="margin-top:4px">убрать</button></th>`).join('');

  const body = rows.map((r) => {
    const best = r.dir && r.v ? bestOf(items.map(r.v), r.dir) : null;
    const cells = items.map((m) => {
      const win = best !== null && r.v && r.v(m) === best && items.length > 1;
      return `<td class="${win ? 'win' : ''}">${r.f(m)}</td>`;
    }).join('');
    const hot = r.p && prio.includes(r.p);
    return `<tr class="${hot ? 'is-priority' : ''}"><th>${r.k}${hot ? ' ★' : ''}</th>${cells}</tr>`;
  }).join('');

  return `<div class="stack-lg">
    <div class="stack">
      <div class="tiny">Этап 4 — сравнение</div>
      <h2 class="h1" style="font-size:clamp(22px,5.4vw,28px)">Сравнение по вашим параметрам</h2>
      <p class="small">Строки со звёздочкой — то, что вы назвали важным
      (${prio.map(priorityName).join(', ') || 'не выбрано'}). Зелёным помечено лучшее значение в строке.</p>
    </div>
    <div class="scrollx">
      <table class="cmp">
        <thead><tr><th></th>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn btn--ghost" data-act="goto" data-v="matches">Назад к списку</button>
      <button class="btn" data-act="goto" data-v="roadmap">Маршрут</button>
    </div>
    <p class="tiny">Оценки репутации и трудоустройства — редакционные ориентиры для демонстрации,
    а не официальный рейтинг. ${esc(DATA_NOTE)}</p>
  </div>`;
}

// ——— 6. Маршрут ———

function roadmapScreen(state, steps, target) {
  const prog = planProgress(steps, state.done);
  const nextId = (steps.find((s) => !state.done[s.id]) || {}).id;

  const list = steps.map((s) => {
    const done = !!state.done[s.id];
    const isNext = s.id === nextId;
    return `<li class="step ${done ? 'is-done' : ''} ${isNext ? 'is-next' : ''}">
      <div class="step__when">${esc(s.when)} · ${CATEGORIES[s.cat].name}</div>
      <div class="step__title">${esc(s.title)}</div>
      <div class="step__detail">${esc(s.detail)}</div>
      <div class="step__meta">
        <button class="check ${done ? 'is-on' : ''}" data-act="done" data-v="${s.id}">
          <span class="check__box">✓</span>${done ? 'Сделано' : 'Отметить'}
        </button>
        ${s.source ? `<a class="chip chip--route" href="${esc(s.source.url)}" target="_blank" rel="noopener">${esc(s.source.label)} ↗</a>` : ''}
        ${s.demo ? demoChip('Даты по циклу 2026 года, кампания 2027 официально не объявлена') : ''}

  return `<div class="stack-lg">
    <div class="stack">
      <div class="tiny">Этап 5 — маршрут</div>
      <h2 class="h1" style="font-size:clamp(22px,5.4vw,28px)">Ваш план до августа 2027</h2>
      ${target
        ? `<p class="note note--change"><b>Целевая программа:</b> ${esc(target.program.short)} — ${esc(target.program.name)}. План построен под её требования.</p>`
        : `<p class="note note--warn">Целевая программа не выбрана, поэтому план общий.
           <button class="link" data-act="goto" data-v="matches">Выберите программу</button>, и шаги станут точнее.</p>`}
    </div>

    <div class="card stack">

        <div class="h3">Прогресс</div>
        <div class="tiny" style="margin-left:auto">${prog.complete} из ${prog.total} шагов</div>
      </div>
      <div class="progress"><div class="progress__fill" style="width:${prog.pct}%"></div></div>
    </div>

    <ol class="route">${list}</ol>

    <p class="note">${esc(CALENDAR_NOTE)}</p>
    <div class="btn-row">
      <button class="btn btn--ghost" data-act="goto" data-v="matches">К рекомендациям</button>

/* ===== src/app.js ===== */
// Контроллер. Один цикл: состояние → пересчёт → полная перерисовка.
// Такой подход выбран сознательно: при любом изменении профиля весь путь
// (диагностика, рекомендации, сравнение, маршрут) пересчитывается из одного
// источника, поэтому экраны не могут разойтись между собой.






const store = createStore();
const root = document.getElementById('app');

const LIMITS = { interests: 3, priorities: 2, langs: 3 };
const SHOW_DOCK = new Set(['matches', 'compare', 'roadmap']);

function derive(state) {
  const result = rankPrograms(state.profile);
  const target =
    (state.targetId && result.matches.find((m) => m.program.id === state.targetId))
    || (state.targetId && programById(state.targetId)
        ? scoreProgram(programById(state.targetId), state.profile)
        : null)
    || result.matches[0]
    || null;
  const steps = buildPlan(state.profile, target);
  return {
    result,
    target,
    steps,
    diag: diagnose(state.profile),
    next: nextStep(steps, state.done),
    progress: planProgress(steps, state.done),
  };
}

function screenHtml(state, d) {
  switch (state.screen) {
    case 'profile': return profileScreen(state);
    case 'diagnosis': return diagnosisScreen(state, d.diag, d.result);
    case 'matches': return matchesScreen(state, d.result);
    case 'compare': {
      const items = state.compareIds
        .map((id) => d.result.matches.find((m) => m.program.id === id)
          || (programById(id) ? scoreProgram(programById(id), state.profile) : null))
        .filter(Boolean);
      return compareScreen(state, items);
    }
    case 'roadmap': return roadmapScreen(state, d.steps, d.target);
    default: return intro();
  }
}

let lastScreen = null;

function render() {
  const state = store.state;
  const d = derive(state);
  const showDock = SHOW_DOCK.has(state.screen) && state.completed;

  const warn = store.persisted
    ? ''
    : `<p class="note note--warn">Браузер не разрешает сохранение, поэтому маршрут
       живёт только до перезагрузки страницы. Проверьте, не включён ли приватный режим.</p>`;

  const sheetItem = state.sheet
    ? (d.result.matches.find((m) => m.program.id === state.sheet)
       || d.result.adjacent.find((m) => m.program.id === state.sheet)
       || d.result.blocked.find((m) => m.program.id === state.sheet)
       || (programById(state.sheet) ? scoreProgram(programById(state.sheet), state.profile) : null))
    : null;

  root.innerHTML = `
    ${topbar(state)}
    <div class="layout">
      ${state.screen === 'intro' ? '' : rail(state)}
      <div>
        <main class="main ${showDock ? 'has-dock' : ''}">${warn}${screenHtml(state, d)}</main>
        ${showDock ? `<div class="dock-wrap">${dock(d.next, d.progress)}</div>` : ''}
      </div>
    </div>
    ${sheetItem ? sheet(sheetItem, state) : ''}`;

  if (state.screen !== lastScreen) {
    window.scrollTo({ top: 0, behavior: 'instant' });
    lastScreen = state.screen;
  }
}

// ——— события ———

function act(name, value) {
  const s = store.state;

  if (name === 'start') return store.set({ screen: 'profile', profileStep: 0 });

  if (name === 'next') {
    if (s.profileStep < PROFILE_TOTAL - 1) {
      return store.set({ profileStep: s.profileStep + 1 });
    }
    return store.set({ screen: 'diagnosis', completed: true });
  }

  if (name === 'back') {
    if (s.sheet) return store.set({ sheet: null });
    if (s.editing) return store.set({ editing: false, screen: 'matches' });
    if (s.screen === 'profile' && s.profileStep > 0) {
      return store.set({ profileStep: s.profileStep - 1 });
    }
    const order = ['intro', 'profile', 'diagnosis', 'matches', 'compare', 'roadmap'];
    const i = Math.max(0, order.indexOf(s.screen) - 1);
    return store.set({ screen: order[i] });
  }

  if (name === 'goto') {
    const patch = { screen: value, sheet: null };
    if (value !== 'matches') patch.changes = null;
    if (value === 'matches' && !s.snapshot) {
      patch.snapshot = snapshotOf(rankPrograms(s.profile));
    }
    return store.set(patch);
  }

  if (name === 'edit') {
    return store.set({ screen: 'profile', profileStep: Number(value), editing: true, changes: null });
  }

  if (name === 'saveEdit') {
    const result = rankPrograms(s.profile);
    const changes = diffResult(s.snapshot, result);
    return store.set({
      screen: 'matches',
      editing: false,
      changes,
      snapshot: snapshotOf(result),
    });
  }

  if (name === 'cancelEdit') return store.set({ screen: 'matches', editing: false });

  if (name.startsWith('set:')) {
    const key = name.slice(4);
    return store.setProfile({ [key]: key === 'entScore' ? Number(value) : value });
  }

  if (name.startsWith('toggle:')) {
    const key = name.slice(7);
    return store.toggleProfileList(key, value, LIMITS[key] || Infinity);
  }

  if (name === 'fixPair') {
    store.setProfile({ pair: value });
    const result = rankPrograms(store.state.profile);
    return store.set({ changes: diffResult(s.snapshot, result), snapshot: snapshotOf(result) });
  }

  if (name === 'open') return store.set({ sheet: value });
  if (name === 'closeSheet') return store.set({ sheet: null });

  if (name === 'target') {
    return store.set({ targetId: s.targetId === value ? null : value, sheet: null });
  }

  if (name === 'compare') {
    const on = s.compareIds.includes(value);
    const next = on
      ? s.compareIds.filter((v) => v !== value)
      : [...s.compareIds, value].slice(-3);
    return store.set({ compareIds: next });
  }

  if (name === 'done') return store.toggleDone(value);

  if (name === 'reset') {
    if (window.confirm('Сбросить профиль и маршрут? Отметки о прогрессе тоже удалятся.')) {
      lastScreen = null;
      store.reset();
    }
    return undefined;
  }

  return undefined;
}

root.addEventListener('click', (e) => {
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if (!el) return;
  // клик внутри листа не должен его закрывать
  if (el.dataset.act === 'closeSheet' && stop) return;
  if (el.dataset.act === 'noop') return;
  e.preventDefault();
  act(el.dataset.act, el.dataset.v);
});

root.addEventListener('input', (e) => {
  const el = e.target.closest('[data-act^="range:"]');
  if (!el) return;
  store.setProfile({ [el.dataset.act.slice(6)]: Number(el.value) });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && store.state.sheet) store.set({ sheet: null });
});

store.subscribe(render);
render();
})();
</script>
</body>
</html>
